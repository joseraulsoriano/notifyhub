name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  smoke:
    name: Prueba de humo (wrangler dev + Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifyhub
          POSTGRES_PASSWORD: notifyhub
          POSTGRES_DB: notifyhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U notifyhub" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://notifyhub:notifyhub@localhost:5432/notifyhub
      # Hyperdrive en `wrangler dev` apunta al Postgres del job.
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://notifyhub:notifyhub@localhost:5432/notifyhub
      DEV_API_KEY: nh_ci_key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @notifyhub/persistence db:deploy
      - run: pnpm db:seed
      - run: bash tests/e2e/smoke.sh
