name: Deploy

# Manual a propósito: cada despliegue cuesta tiempo de contenedor y aplica migraciones en Neon.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migraciones y despliegue a Cloudflare
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@notifyhub/persistence...
      - name: Migraciones en Neon
        run: pnpm --filter @notifyhub/persistence db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: wrangler deploy (Worker + imagen del contenedor)
        working-directory: apps/edge
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
