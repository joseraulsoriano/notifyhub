openapi: 3.1.0
info:
  title: NotifyHub API
  version: 0.1.0
  license: { name: MIT, identifier: MIT }
  summary: Servicio de Notificaciones y Registro Multicanal
  description: |
    Recibe solicitudes de notificación (RF1), las despacha de forma asíncrona por el proveedor adecuado
    (RF2, RF3) y expone su estado y bitácora (RF4).

    **Autenticación:** cada cliente envía su llave en `X-API-Key`.

    **Idempotencia:** si se envía `Idempotency-Key`, los reintentos con la misma llave y el mismo cuerpo
    durante 24 h devuelven la notificación original (encabezado `Idempotent-Replayed: true`) y no generan
    otro envío. La misma llave con un cuerpo distinto responde `409`.

    **Límite de solicitudes:** cada cliente tiene un límite por minuto. Las respuestas incluyen
    `RateLimit-Limit`, `RateLimit-Remaining` y `RateLimit-Reset`; al excederlo se responde `429` con `Retry-After`.

    **Errores:** todos usan `application/problem+json` (RFC 9457).
servers:
  - url: http://localhost:8787
    description: Local (Docker Compose)
security:
  - ApiKey: []
tags:
  - name: Notificaciones
    description: Recepción y consulta de notificaciones (RF1)
  - name: Bitácora
    description: Auditoría de intentos de envío (RF4)
  - name: Proveedores
    description: Catálogo, capacidad y controles administrativos
  - name: Suscripciones
    description: Registro de destinos para eventos (el relay de entrega aún no está activo)
  - name: Salud
    description: Verificaciones para el orquestador

paths:
  /v1/notifications:
    post:
      tags: [Notificaciones]
      operationId: createNotification
      summary: Recibir una solicitud de notificación (RF1)
      description: |
        Valida, persiste y encola la solicitud según su prioridad, y responde de inmediato con `202`.
        El envío ocurre en segundo plano; su avance se consulta con `GET /v1/notifications/{id}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotificationRequest' }
            examples:
              correo:
                summary: Alerta por correo de prioridad alta
                value:
                  sender: { name: Banco Demo, email: alertas@banco.demo }
                  recipient: { email: ana@example.com, phone: '+5212221234567' }
                  message: { subject: Cargo detectado, body: 'Se hizo un cargo de $1,200 a tu tarjeta.' }
                  priority: alta
                  preferredChannel: EMAIL
      responses:
        '202':
          description: Solicitud aceptada y encolada (o reproducida por idempotencia)
          headers:
            Location: { schema: { type: string }, description: Ruta del recurso creado }
            Idempotent-Replayed:
              {
                schema: { type: string, enum: ['true'] },
                description: Presente si se reprodujo una solicitud previa,
              }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: La Idempotency-Key ya se usó con un cuerpo distinto
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    get:
      tags: [Notificaciones]
      operationId: listNotifications
      summary: Listar notificaciones del cliente (SCRUM-54)
      description: |
        Lista paginada, de la más reciente a la más antigua, para consolas y paneles. Devuelve solo las
        notificaciones del cliente autenticado y **enmascara** los datos de contacto (política de datos personales).
        El detalle completo con intentos e historial está en `GET /v1/notifications/{id}`.

        Para llamar desde un navegador, el origen debe estar en `CORS_ALLOWED_ORIGINS` del Worker.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/NotificationStatus' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: 'Busca en asunto, cuerpo, id e Idempotency-Key (sin distinguir mayúsculas)'
        - {
            name: cursor,
            in: query,
            schema: { type: string },
            description: Cursor opaco de la página anterior,
          }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Página de notificaciones
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/NotificationListItem' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/notifications/{id}:
    get:
      tags: [Notificaciones]
      operationId: getNotification
      summary: Consultar estado e historial de intentos
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Estado actual, intentos de entrega e historial de estados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No existe o pertenece a otro cliente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/providers:
    get:
      tags: [Proveedores]
      operationId: listProviders
      summary: Catálogo de proveedores y su salud (SCRUM-55)
      responses:
        '200':
          description: Proveedores de los cuatro canales
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Provider' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/providers/{code}:
    patch:
      tags: [Proveedores]
      operationId: updateProvider
      summary: Cambiar la salud o el estado de un proveedor (SCRUM-55)
      description: |
        Afecta a **todos** los clientes, por eso solo lo pueden hacer los clientes listados en
        `PROVIDER_ADMIN_CLIENTS` del Worker (ids o nombres, o `*` en entornos de demostración). Con la variable
        vacía responde `403`. Con la salud en `DOWN` el despachador falla ese proveedor y hace fallback.
        En esta versión la salud es manual y el transporte es simulado; no se consulta la disponibilidad real
        de SendGrid, Twilio o Firebase.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, examples: [fcm] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                health: { $ref: '#/components/schemas/ProviderHealth' }
                enabled: { type: boolean }
      responses:
        '200':
          description: Proveedor actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El cliente no puede modificar proveedores
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No existe el proveedor
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/audit-log:
    get:
      tags: [Bitácora]
      operationId: listAuditLog
      summary: Consultar la bitácora de auditoría (RF4, SCRUM-55)
      parameters:
        - { name: notificationId, in: query, schema: { type: string, format: uuid } }
        - { name: eventType, in: query, schema: { type: string, examples: [delivery.attempt] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AttemptStatus' } }
        - { name: provider, in: query, schema: { type: string, examples: [twilio] } }
        - {
            name: cursor,
            in: query,
            schema: { type: string },
            description: Cursor opaco de la página anterior,
          }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Página de entradas de bitácora
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/dispatch/capacity:
    get:
      tags: [Proveedores]
      operationId: getDispatchCapacity
      summary: Consultar capacidad global por proveedor
      description: Los conteos son agregados y los límites son de solo lectura.
      responses:
        '200':
          description: Snapshot global de ejecución
          content:
            application/json:
              schema:
                type: object
                required: [observedAt, providers]
                properties:
                  observedAt: { type: string, format: date-time }
                  providers:
                    type: array
                    items:
                      type: object
                      required: [provider, limit, activeCount, waitingCount]
                      properties:
                        provider: { type: string }
                        limit: { type: integer, minimum: 1 }
                        activeCount: { type: integer, minimum: 0 }
                        waitingCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/subscriptions:
    get:
      tags: [Suscripciones]
      operationId: listSubscriptions
      summary: Listar suscripciones del cliente autenticado
      responses:
        '200':
          description: Destinos y eventos configurados
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/NotificationSubscription' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Suscripciones]
      operationId: createSubscription
      summary: Registrar una suscripción
      description: |
        Guarda configuración y devuelve un secreto de firma una sola vez. No inicia entregas: el relay
        outbox→webhook aún no está desplegado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
      responses:
        '201':
          description: Suscripción registrada; guarda el secreto porque no se vuelve a mostrar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NotificationSubscription'
                  - type: object
                    required: [signingSecret]
                    properties:
                      signingSecret: { type: string, description: Secreto de firma mostrado solo al crearlo }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/subscriptions/{id}:
    patch:
      tags: [Suscripciones]
      operationId: setSubscriptionActive
      summary: Activar o pausar una suscripción propia
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              additionalProperties: false
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Suscripción actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSubscription' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No existe o pertenece a otro cliente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /health:
    get:
      tags: [Salud]
      operationId: health
      summary: Verificación de vida (sin autenticación)
      description: Solo comprueba que el Worker responde; no valida PostgreSQL, migraciones, Queues ni proveedores.
      security: []
      responses:
        '200':
          description: El proceso responde
          content:
            application/json:
              schema: { type: object, properties: { status: { const: ok } } }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Llave única por intento lógico del cliente (8–255 caracteres). Vigencia de 24 h.
      schema: { type: string, minLength: 8, maxLength: 255 }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RateLimit-Limit: { schema: { type: integer }, description: Solicitudes permitidas por ventana }
    RateLimit-Remaining: { schema: { type: integer }, description: Solicitudes restantes en la ventana }
    RateLimit-Reset: { schema: { type: integer }, description: Segundos para reiniciar la ventana }

  responses:
    ValidationError:
      description: Cuerpo o parámetros inválidos; `errors` detalla cada campo
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://notifyhub.dev/problems/validation
            title: Solicitud inválida
            status: 400
            errors:
              - { path: recipient.deviceToken, message: el canal PUSH requiere recipient.deviceToken }
    Unauthorized:
      description: Falta X-API-Key, o es inválida o está revocada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Se excedió el límite del cliente
      headers:
        Retry-After: { schema: { type: integer }, description: Segundos de espera }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Priority:
      description: La API normaliza a HIGH, MEDIUM o LOW; también acepta `alta`, `media` y `baja` sin importar mayúsculas.
      type: string
      enum: [HIGH, MEDIUM, LOW, alta, media, baja]
    Channel:
      type: string
      enum: [EMAIL, SMS, PUSH, WEBHOOK]
    NotificationStatus:
      type: string
      enum: [RECEIVED, QUEUED, SENDING, RETRYING, FALLBACK, SENT, DELIVERED, FAILED]
    AttemptStatus:
      type: string
      enum: [SENT, FAILED, RETRYING]
    E164:
      type: string
      pattern: '^\+[1-9]\d{7,14}$'
      examples: ['+5212221234567']

    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [sender, recipient, message, priority, preferredChannel]
      description: El destinatario debe incluir el dato del canal preferente (EMAIL→email, SMS→phone, PUSH→deviceToken, WEBHOOK→webhookUrl). Los demás datos habilitan el fallback.
      properties:
        sender:
          type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email }
            phone: { $ref: '#/components/schemas/E164' }
        recipient:
          type: object
          minProperties: 1
          properties:
            email: { type: string, format: email }
            phone: { $ref: '#/components/schemas/E164' }
            deviceToken: { type: string, minLength: 10, maxLength: 4096 }
            webhookUrl: { type: string, format: uri, pattern: '^https://' }
        message:
          type: object
          required: [body]
          properties:
            subject: { type: string, maxLength: 200 }
            body: { type: string, minLength: 1, maxLength: 10000 }
            data: { type: object, additionalProperties: { type: string } }
        priority: { $ref: '#/components/schemas/Priority' }
        preferredChannel: { $ref: '#/components/schemas/Channel' }

    NotificationSummary:
      type: object
      required: [id, status, priority, preferredChannel, createdAt, links]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/NotificationStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        preferredChannel: { $ref: '#/components/schemas/Channel' }
        createdAt: { type: string, format: date-time }
        links:
          type: object
          properties:
            self: { type: string, examples: ['/v1/notifications/3f1c…'] }

    NotificationListItem:
      allOf:
        - $ref: '#/components/schemas/NotificationSummary'
        - type: object
          required: [updatedAt, recipient, attemptCount, usedFallback, totalLatencyMs]
          properties:
            updatedAt: { type: string, format: date-time }
            subject: { type: [string, 'null'] }
            preview: { type: string, description: Primeros 140 caracteres del cuerpo }
            recipient:
              type: string
              description: Dato de contacto del canal, enmascarado
              examples: ['a***@example.com', '+52 ****-5678']
            idempotencyKey: { type: [string, 'null'] }
            attemptCount: { type: integer, minimum: 0 }
            usedFallback: { type: boolean }
            finalChannel: { oneOf: [{ $ref: '#/components/schemas/Channel' }, { type: 'null' }] }
            totalLatencyMs: { type: integer, minimum: 0 }

    NotificationDetail:
      allOf:
        - $ref: '#/components/schemas/NotificationSummary'
        - type: object
          required: [updatedAt, attempts, history]
          properties:
            updatedAt: { type: string, format: date-time }
            attempts:
              type: array
              items: { $ref: '#/components/schemas/DeliveryAttempt' }
            history:
              type: array
              items:
                type: object
                properties:
                  from: { oneOf: [{ $ref: '#/components/schemas/NotificationStatus' }, { type: 'null' }] }
                  to: { $ref: '#/components/schemas/NotificationStatus' }
                  at: { type: string, format: date-time }

    DeliveryAttempt:
      type: object
      properties:
        attemptNumber: { type: integer, minimum: 1 }
        provider: { type: string, examples: [sendgrid, twilio, fcm, webhook] }
        channel: { $ref: '#/components/schemas/Channel' }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        isFallback: { type: boolean }
        providerMessageId: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        latencyMs: { type: [integer, 'null'] }
        attemptedAt: { type: string, format: date-time }

    ProviderHealth:
      type: string
      enum: [UP, DEGRADED, DOWN]

    Provider:
      type: object
      required: [code, channel, costPerMessage, reliabilityScore, health, enabled]
      properties:
        code: { type: string, examples: [sendgrid, twilio, fcm, webhook] }
        channel: { $ref: '#/components/schemas/Channel' }
        costPerMessage: { type: number }
        reliabilityScore: { type: integer, minimum: 0, maximum: 100 }
        health: { $ref: '#/components/schemas/ProviderHealth' }
        enabled: { type: boolean }

    SubscriptionEventType:
      type: string
      enum: [notification.status_changed, notification.attempted]

    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [subscriberName, targetUrl, eventTypes]
      properties:
        subscriberName: { type: string, minLength: 1, maxLength: 120 }
        targetUrl: { type: string, format: uri, pattern: '^https://', maxLength: 2048 }
        eventTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/SubscriptionEventType' }

    NotificationSubscription:
      type: object
      required: [id, subscriberName, targetUrl, eventTypes, active]
      properties:
        id: { type: string, format: uuid }
        subscriberName: { type: string }
        targetUrl: { type: string, format: uri }
        eventTypes:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionEventType' }
        active: { type: boolean }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        notificationId: { type: string, format: uuid }
        eventType: { type: string }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/NotificationStatus' }, { type: 'null' }] }
        toStatus: { $ref: '#/components/schemas/NotificationStatus' }
        channel: { oneOf: [{ $ref: '#/components/schemas/Channel' }, { type: 'null' }] }
        providerCode: { type: [string, 'null'] }
        detail:
          {
            type: [object, 'null'],
            description: Respuesta del proveedor sanitizada (datos personales enmascarados),
          }
        occurredAt: { type: string, format: date-time }

    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
