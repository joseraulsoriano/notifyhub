name: taskflow-v2

x-service: &service
  restart: unless-stopped
  environment: &common-environment
    DATABASE_URL: postgresql://tasks:${POSTGRES_PASSWORD:-tasks_dev_password}@postgres:5432/tasks
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?Copia .env.example a .env y configura JWT_SECRET}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Configura INTERNAL_TOKEN en .env (32+ caracteres)}
    TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-900}
    BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 20

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks_dev_password}
      POSTGRES_DB: tasks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    <<: *service
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *common-environment
      PORT: 8081

  task-service:
    <<: *service
    build:
      context: .
      dockerfile: services/tasks/Dockerfile
    environment:
      <<: *common-environment
      PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  notification-service:
    <<: *service
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      <<: *common-environment
      PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  presence-service:
    <<: *service
    build:
      context: .
      dockerfile: services/presence/Dockerfile
    environment:
      <<: *common-environment
      PORT: 8084

  api-gateway:
    <<: *service
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *common-environment
      PORT: 8080
      AUTH_URL: http://auth-service:8081
      TASK_URL: http://task-service:8082
      NOTIFICATION_URL: http://notification-service:8083
      PRESENCE_URL: http://presence-service:8084
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      auth-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

volumes:
  postgres-data:
  redis-data:
