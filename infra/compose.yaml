# Entorno local de NotifyHub (NH-11): `pnpm infra:up`
name: notifyhub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifyhub
      POSTGRES_PASSWORD: notifyhub
      POSTGRES_DB: notifyhub
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifyhub']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # SMTP falso para probar correo sin SendGrid: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

  # Proveedores simulados (Twilio, SendGrid, FCM) con respuestas de éxito, 5xx y timeouts: http://localhost:8089
  wiremock:
    image: wiremock/wiremock:3.13.0
    command: ['--global-response-templating', '--verbose']
    ports: ['8089:8080']
    volumes: ['./wiremock:/home/wiremock']

  # Grafana + Prometheus + Loki + Tempo + colector OTLP en una sola imagen: http://localhost:3001
  lgtm:
    image: grafana/otel-lgtm:latest
    ports: ['3001:3000', '4317:4317', '4318:4318']

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../.env.example
    environment:
      DATABASE_URL: postgresql://notifyhub:notifyhub@postgres:5432/notifyhub
      REDIS_URL: redis://redis:6379
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
